[project]
name = "yt-digest-node"
version = "0.1.0"
description = "yt-digest node: transcript pipeline"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["mypy", "pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_digest_node"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
